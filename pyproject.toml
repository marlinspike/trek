[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "begin-remake"
version = "1.3.0"
description = "A real-time tactical starship simulation inspired by Begin 2 (personal fan project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Code: MIT. See LICENSING.md for content and trademark notes." }
dependencies = [
  "pygame-ce>=2.5",
  "moderngl>=5.8",          # GPU presenter (sharp on Retina/4K, bloom); the game falls back to software without it
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.5"]
llm = ["anthropic"]

[project.scripts]
begin = "begin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
begin = ["content/data/*.toml", "voice/*.swift", "assets/icon.png", "assets/fonts/*", "assets/help/*.md", "assets/ships/*.png", "assets/ships/fleet/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["begin"]
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mixins typed by the class they are mixed into (`self: BattleScene`, `self: BattleSession`, `self: Bridge`)
module = ["begin.ui.battle.*", "begin.session.*", "begin.crew.chatter"]
disable_error_code = ["misc"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# syntax errors and pyflakes (unused imports and variables, undefined names); CI runs `ruff check`
select = ["E9", "F"]
