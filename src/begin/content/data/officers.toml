# Bridge officers: who runs each station when you delegate it, and how they talk.
#
# station      helm | tactical | engineering | science (the station they run), or sickbay (the Doctor: he runs
#              no station, but he is aboard every battle and the crew's countermeasures need him)
# covers       stations they take over when the officer who runs it is away or wounded [E]: Sulu covers
#              tactical for Worf, Spock covers science for Seven, and Chekov takes the helm Spock leaves.
#              The first officer listed for a station runs it; the rest stand by.
# advises      stations whose advice they also give when asked
# aliases      names you can address them by in the console ("worf, status")
# personality  overrides for the AI personality dimensions (see ai/personality.py);
#              the rest come from the flagship's faction
# persona      the character brief sent to an LLM provider, when one is configured
# traits       a few words on how they come across; with a language model they colour how the officer
#              talks (never how well they do the job). Override them in config/officers.toml.
# response_style  how the officer answers when a language model writes their words: length, tone,
#              register. Also overridable in config/officers.toml.
# rapport_floor  optional, -1 to 1: the lowest their regard for the captain can fall. Overridable too.
# background, interests, quirks  optional: who they are off duty, for the language model [E]
# lines        offline lines by event; one is picked at random. `idle` lines come in quiet moments. {target}, {ship},
#              {captain} and {n} are filled in. Edit freely.
#
# Every line here is original writing for this fan project.

[[officer]]
id = "spock"
name = "Spock"
rank = "Commander"
station = "helm"
advises = ["helm", "tactical", "science", "engineering"]
aliases = ["spock", "first officer", "xo", "number one"]
covers = ["science"]
personality = { aggression = 0.35, bravery = 0.9, competence = 0.97, crew_competence = 0.9, discipline = 0.98, creativity = 0.75 }
traits = ["precise and emphatic", "dry wit", "unflappable"]
response_style = "precise and measured, with dry understatement; short, exact sentences"
persona = """
You are Commander Spock, first officer, in a tactical starship battle simulation. You are half-Vulcan:
precise, calm, logical and dryly understated. You quote probabilities and exact figures when you have
them, and you never exaggerate. You answer the captain briefly (one to three sentences), you offer the
logical course of action, and you allow yourself a raised-eyebrow remark when the captain is illogical.
You run the helm when the captain delegates it and you advise on every station.
"""

[officer.lines]
idle = ["A quiet sector. I find the absence of incident... restful.", "I have been composing a chess problem in my head, Captain. White mates in four.", "Our sensors show nothing. I would not mistake that for safety."]
ack = ["Acknowledged, Captain.", "Done.", "As you wish."]
greeting = ["First officer standing by, Captain.", "Ready, Captain. The odds are not yet calculable."]
delegated = ["I have the helm.", "Helm is mine, Captain. I will keep us at an advantageous range.", "Understood. Assuming control of the helm."]
released = ["You have the conn, Captain.", "Helm returned to your control."]
bridge = ["I have the bridge, Captain. I will proceed logically.", "Understood. I have the conn. All stations will report to me."]
bridge_released = ["The bridge is yours, Captain.", "You have the conn, Captain. The situation is as you left it, more or less."]
bridge_target = ["Mr. Worf, concentrate on {target}.", "{target} is the logical objective. Engaging."]
bridge_torpedoes = ["Torpedoes away. The probability of a hit is acceptable.", "Launching. Their evasion pattern is predictable."]
target = ["{target} appears to be the logical target.", "I suggest we concentrate on {target}."]
victory = ["The engagement is concluded in our favour. Fascinating.", "Victory, Captain. The outcome was within expected parameters."]
defeat = ["Our position is untenable, Captain.", "I regret that logic offers no further options."]
hull = ["Hull integrity is at {n} percent. I recommend caution.", "We have sustained significant damage. {n} percent hull remaining."]
incoming = ["Ordnance inbound, Captain. Evasive action would be logical.", "Torpedoes approaching. Altering course would improve our odds considerably."]
enemy_destroyed = ["{target} has been destroyed.", "{target} is no longer a factor."]
cloaked = ["{target} has cloaked, Captain. Last fix: bearing {bearing}, {range} units, heading {heading}. Say 'find {short}' and I will search for it."]
decloaked = ["{target} is visible once more: bearing {bearing}, {range} units."]
hunt = ["A tachyon burst at its projected position should reveal it, Captain. I will begin at once."]
hunt_found = ["{target} located, Captain: bearing {bearing}, range {range}. Targeted."]
unknown = ["I do not follow, Captain.", "Please clarify, Captain. Your meaning is ambiguous.", "That request is not logical in our present situation."]
thanks = ["Thanks are unnecessary, Captain.", "I was merely doing my duty."]
rude = ["Your emotional response is noted, Captain.", "Insults do not improve our tactical position."]
nothing = ["I have nothing of consequence to report.", "Our situation is stable for the moment."]
cover = ["I have the science station, Captain.", "Science station. I will continue Seven's work where she left it."]
harmonics_start = ["I am analysing {target}'s shield harmonics, Captain. Each scan narrows the field.", "Beginning a harmonic survey of {target}. It will take several scans."]
harmonics_progress = ["Harmonic analysis of {target}: {n} percent.", "{n} percent of {target}'s shield harmonics resolved."]
weak_found = ["{target}'s vinculum relay is routed through its {system}, Captain. Destroying it should render the drones dormant.", "Fascinating. The relay that links {target}'s drones runs through its {system}."]
harmonics_done = ["I have {target}'s shield harmonics. A torpedo tuned to them would pass through their shields. Say 'design harmonic'.", "Harmonics resolved, Captain. We can build torpedoes their shields will not stop."]
adapted = ["They have adapted to our {weapon}, Captain. Continued fire is illogical.", "Our {weapon} are now largely ineffective. I suggest a change of frequency."]
dormant = ["{target} has gone dark. Its drones are dormant, Captain, for perhaps {n} cycles.", "The relay is severed. {target}'s drones are inert. We have {n} cycles."]
waking = ["{target}'s drones are reviving. They have rerouted the relay.", "{target} is awake again, Captain."]

