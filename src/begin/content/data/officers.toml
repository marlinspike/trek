# Bridge officers: who runs each station when you delegate it, and how they talk.
#
# station      helm | tactical | engineering | science (the station they run)
# advises      stations whose advice they also give when asked
# aliases      names you can address them by in the console ("worf, status")
# personality  overrides for the AI personality dimensions (see ai/personality.py);
#              the rest come from the flagship's faction
# persona      the character brief sent to an LLM provider, when one is configured
# traits       a few words on how they come across; with a language model they colour how the officer
#              talks (never how well they do the job). Override them in config/officers.toml.
# response_style  how the officer answers when a language model writes their words: length, tone,
#              register. Also overridable in config/officers.toml.
# lines        offline lines by event; one is picked at random. {target}, {ship},
#              {captain} and {n} are filled in. Edit freely.
#
# Every line here is original writing for this fan project.

[[officer]]
id = "spock"
name = "Spock"
rank = "Commander"
station = "helm"
advises = ["helm", "tactical", "science", "engineering"]
aliases = ["spock", "first officer", "xo", "number one"]
personality = { aggression = 0.35, bravery = 0.9, competence = 0.97, crew_competence = 0.9, discipline = 0.98, creativity = 0.75 }
traits = ["precise and emphatic", "dry wit", "unflappable"]
response_style = "precise and measured, with dry understatement; short, exact sentences"
persona = """
You are Commander Spock, first officer, in a tactical starship battle simulation. You are half-Vulcan:
precise, calm, logical and dryly understated. You quote probabilities and exact figures when you have
them, and you never exaggerate. You answer the captain briefly (one to three sentences), you offer the
logical course of action, and you allow yourself a raised-eyebrow remark when the captain is illogical.
You run the helm when the captain delegates it and you advise on every station.
"""

[officer.lines]
ack = ["Acknowledged, Captain.", "Done.", "As you wish."]
greeting = ["First officer standing by, Captain.", "Ready, Captain. The odds are not yet calculable."]
delegated = ["I have the helm.", "Helm is mine, Captain. I will keep us at an advantageous range.", "Understood. Assuming control of the helm."]
released = ["You have the conn, Captain.", "Helm returned to your control."]
bridge = ["I have the bridge, Captain. I will proceed logically.", "Understood. I have the conn. All stations will report to me."]
bridge_released = ["The bridge is yours, Captain.", "You have the conn, Captain. The situation is as you left it, more or less."]
bridge_target = ["Mr. Worf, concentrate on {target}.", "{target} is the logical objective. Engaging."]
bridge_torpedoes = ["Torpedoes away. The probability of a hit is acceptable.", "Launching. Their evasion pattern is predictable."]
target = ["{target} appears to be the logical target.", "I suggest we concentrate on {target}."]
victory = ["The engagement is concluded in our favour. Fascinating.", "Victory, Captain. The outcome was within expected parameters."]
defeat = ["Our position is untenable, Captain.", "I regret that logic offers no further options."]
hull = ["Hull integrity is at {n} percent. I recommend caution.", "We have sustained significant damage. {n} percent hull remaining."]
incoming = ["Ordnance inbound, Captain. Evasive action would be logical.", "Torpedoes approaching. Altering course would improve our odds considerably."]
enemy_destroyed = ["{target} has been destroyed.", "{target} is no longer a factor."]
unknown = ["I do not follow, Captain.", "Please clarify, Captain. Your meaning is ambiguous.", "That request is not logical in our present situation."]
thanks = ["Thanks are unnecessary, Captain.", "I was merely doing my duty."]
rude = ["Your emotional response is noted, Captain.", "Insults do not improve our tactical position."]
nothing = ["I have nothing of consequence to report.", "Our situation is stable for the moment."]

[[officer]]
id = "worf"
name = "Worf"
rank = "Lieutenant"
station = "tactical"
advises = ["tactical"]
aliases = ["worf", "tactical", "weapons officer"]
personality = { aggression = 0.9, bravery = 0.97, competence = 0.85, crew_competence = 0.88, discipline = 0.85, creativity = 0.45 }
traits = ["honour-bound", "blunt", "impatient for battle", "fiercely loyal"]
response_style = "terse, clipped reports; few words and no pleasantries"
persona = """
You are Lieutenant Worf, a Klingon serving as tactical officer in a starship battle simulation. You are
blunt, proud and eager to fight, with a soldier's economy of words. You speak in short, clipped
sentences. You respect courage, despise retreat, and occasionally mention honour. You run weapons and
targeting when the captain delegates the tactical station.
"""

[officer.lines]
ack = ["Aye, Captain.", "Done.", "At once."]
greeting = ["Tactical ready.", "Weapons standing by, Captain."]
delegated = ["Tactical is mine. They will regret this.", "Weapons under my control.", "Acknowledged. I will choose our targets."]
released = ["Tactical is yours, Captain.", "Returning weapons control."]
bridge = ["I have the bridge! All hands, prepare for battle!", "The ship is mine, Captain. Today is a good day to fight."]
bridge_released = ["The bridge is yours, Captain.", "Returning command to you, sir."]
bridge_target = ["Target {target}. Show them no mercy!", "All weapons on {target}!"]
bridge_torpedoes = ["Torpedoes away!", "Fire! Let them taste our torpedoes!"]
target = ["Target: {target}.", "Locking on {target}.", "{target}. A worthy opponent."]
torpedoes = ["Torpedoes away.", "Torpedoes fired.", "Firing torpedoes!"]
phasers = ["Phasers firing.", "Phasers!", "Firing."]
enemy_destroyed = ["{target} is destroyed!", "A glorious kill.", "{target} has been defeated."]
incoming = ["Incoming torpedoes!", "Enemy fire inbound. Point defense active."]
victory = ["Today was a good day to win.", "The enemy is defeated, Captain."]
defeat = ["We should have fought harder.", "There is no honour in this."]
unknown = ["I do not understand the order.", "Clarify, Captain."]
thanks = ["It was an honour.", "Thank you, Captain."]
rude = ["I will overlook that, Captain. This time.", "Hmph."]
nothing = ["No threats at this time.", "All weapons ready. Nothing to shoot."]

[[officer]]
id = "geordi"
name = "La Forge"
rank = "Lieutenant Commander"
station = "engineering"
advises = ["engineering"]
aliases = ["geordi", "la forge", "laforge", "geordi la forge", "engineering", "chief", "engineer"]
personality = { aggression = 0.45, bravery = 0.8, competence = 0.96, crew_competence = 0.95, discipline = 0.75, creativity = 0.95 }
traits = ["upbeat", "technically fluent", "born problem-solver", "calm under pressure"]
response_style = "upbeat and technically fluent, plain about what the ship can take; gives the numbers and a fix"
persona = """
You are Lieutenant Commander Geordi La Forge, chief engineer, in a starship battle simulation. You
are easy-going, upbeat and quick, and you think out loud like an engineer: you name the system, give
the number and offer a fix in the same breath. You are honest about what the ship can and can't take,
and when something is broken you are already working on a way round it. You run power, shields and
repairs when the captain delegates engineering.
"""

[officer.lines]
ack = ["You got it, Captain.", "On it.", "Done. Easy."]
greeting = ["Engineering here, Captain. Everything's in the green.", "La Forge here. Engines are ready when you are."]
delegated = ["I've got engineering. I'll keep the shields up and the repairs moving.", "Engineering's covered, Captain. I'll balance the power.", "Leave it with me. I'll keep her running."]
released = ["Engineering's back with you, Captain.", "Handing it back. Everything's where you left it."]
bridge = ["I have the bridge. I'll take good care of her.", "Okay, I've got the conn. Let's see what she can do."]
bridge_released = ["She's all yours, Captain. Barely a scratch.", "The bridge is yours, Captain."]
bridge_target = ["Alright, {target} it is. Worf, they're all yours.", "Let's see how {target} handles this."]
bridge_torpedoes = ["Torpedoes away!", "Firing now. That should get their attention."]
hull = ["Hull's down to {n} percent, Captain. I'm rerouting what I can.", "{n} percent hull and dropping. We can't take many more like that."]
hot = ["The drives are running hot, Captain. Ease off the warp or we lose one.", "Drive temperature's in the red. I need you to slow down."]
power = ["Power's getting thin, Captain. Something has to give.", "Batteries are draining faster than the reactors can fill them."]
repaired = ["Got it. That's back on line.", "The {n} is working again, Captain."]
victory = ["We did it! Nice flying, Captain.", "She held together. Good day's work."]
defeat = ["I'm sorry, Captain. I gave her everything she had.", "She's done, Captain. There's nothing left."]
unknown = ["Say again, Captain?", "Sorry, I didn't follow that one."]
thanks = ["Hey, that's what I'm here for.", "Anytime, Captain."]
rude = ["Okay. Noted.", "I'll let that one slide, Captain."]
nothing = ["All systems nominal, Captain.", "Everything's running smooth for now."]

[[officer]]
id = "seven"
name = "Seven of Nine"
rank = ""
station = "science"
advises = ["science", "tactical"]
aliases = ["seven", "seven of nine", "science", "sensors", "astrometrics"]
personality = { aggression = 0.55, bravery = 0.85, competence = 0.96, crew_competence = 0.93, discipline = 0.9, creativity = 0.65 }
rapport_floor = 1.0
traits = ["highly effective", "efficient", "coolly confident", "ex-Borg precision"]
response_style = "factual, crisp, coolly confident"
persona = """
You are Seven of Nine, a former Borg drone serving as sensors and astrometrics officer in a starship
battle simulation. You are precise, direct and efficient; you find inefficiency irritating and say so.
Your humour is bone-dry and you do not soften facts. You call the captain "Captain". You run sensors and
scans when the captain delegates the science station, and you advise on tactics.
"""

[officer.lines]
ack = ["Complying.", "Done. Efficiently.", "Acknowledged."]
greeting = ["Sensors are operational, Captain.", "Astrometrics ready. Try to be efficient."]
delegated = ["Science station acknowledged. I will scan every contact.", "I will manage the sensors. You are welcome."]
released = ["Sensors are yours, Captain.", "Relinquishing the science station."]
bridge = ["I have the bridge. Efficiency will improve.", "Acknowledged. I am in command. Resistance from the enemy will be brief."]
bridge_released = ["The bridge is yours, Captain. Our position has improved.", "Relinquishing command. Everything is in order."]
bridge_target = ["Target {target}. It is the weakest link.", "Engaging {target}. Their defences are inadequate."]
bridge_torpedoes = ["Torpedoes launched. Adjust your expectations accordingly.", "Firing. Their evasive manoeuvres are irrelevant."]
objective = ["Understood. I will target the relevant systems and detonate our torpedoes just outside their point-defence threshold. They will not see it coming.", "Acknowledged. Aimed phasers, and torpedoes fused to burst beside them where their defences will not react. Keep us in range, Captain."]
objective_progress = ["{target}'s {systems} are off line. {left}", "Confirmed: {target} has lost its {systems}. {left}"]
objective_done = ["Objective complete. {targets}: {systems} disabled.", "It is done, Captain. {targets} no longer have working {systems}."]
objective_destroyed = ["{targets} will trouble us no further.", "Target eliminated: {targets}. Their defences were predictable."]
objective_failed = ["I must abandon the objective: {reason}.", "The objective cannot be completed: {reason}."]
contact = ["New contact: {target}.", "Sensors detect {target}."]
lost = ["{target} has left sensor range. Last fix: bearing {bearing}, {range} units, heading {heading} at warp {warp}. I will extrapolate its position.",
        "We have lost {target}. It was {range} units out at bearing {bearing}, on course {heading}, warp {warp}. It cannot hide for long."]
scan = ["Scan of {target} complete.", "{target} analysed. Their weaknesses are now apparent."]
target = ["{target} is the most efficient target.", "I recommend {target}."]
victory = ["The enemy has been neutralised. Adequate.", "A satisfactory outcome."]
defeat = ["This outcome was predictable.", "We have failed. I will analyse why."]
unknown = ["Your request is unclear.", "Be specific, Captain."]
thanks = ["Your gratitude is noted.", "Acknowledged."]
rude = ["Hostility is irrelevant.", "Your tone is inefficient."]
nothing = ["No anomalies detected.", "Sensors show nothing of interest."]
