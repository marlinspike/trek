# Hull geometry, subsystem anchors and weapon mounts.  [remake extension]
#
# Begin treated ships as points; these silhouettes, mount positions and arcs
# are ours. They drive rendering, phaser origins, firing arcs and the
# location-aware subsystem damage model.
#
# Design coordinates: +y = bow, +x = starboard, the hull spans roughly
# y = -50..+50 (100 design units = `length` world units).
# Shapes: {kind="poly", pts=[[x,y],...]} or {kind="ellipse", c=[x,y], r=[rx,ry]}.
#   role "hull" is filled, "nacelle" is filled with the engine tint,
#   "detail" is stroked only.
# Mounts: pos in design units; arc = [center, width] in degrees relative to the
#   bow (0 = ahead, 90 = starboard). A phaser target must lie inside the arc;
#   tube arcs apply only when Rules.tube_arcs is on (Begin's tubes fire any way).
# Anchors place internal systems: bridge, core (reactors, batteries,
#   computer), nose (sensors), aft (impulse, tractor), nacelles (warp drives).

