# Factions. `dogma` is Begin's decoded nation dogma [R]; everything else is a
# remake extension [E]: computer sophistication, captain competence model,
# doctrine and ordnance compatibility.
#
# computer.sophistication (0..1) drives concrete capabilities, never a flat
# combat bonus: point-defense reaction time and track quality, torpedo
# solution accuracy, scan fidelity, dead-reckoning of lost contacts, threat
# prediction horizon and the quality of recommendations shown to the player.
#
# sensors.range (×) scales every class's rated sensor range for this faction [E].
# Inside rated range an uncloaked ship is seen exactly and identified; out to
# 1.5× it is a hazy, unidentified return; beyond that it is lost.

[[faction]]
id = "federation"
name = "Federation"
long_name = "United Federation of Planets"
command = "Starfleet Command"
doctrine = "starfleet"
torpedoes = ["mk7", "mk8"]
probes = ["px2", "pxd2"]
officer_names = ["Spock", "Sulu", "Chekov", "Uhura", "Scott", "McCoy"]
captain_names = ["Webster", "Bronson", "Decker", "Wesley", "Pappas", "Chang", "Garrovick", "Tracey", "Harris", "Rios", "Shaw", "Vale"]
dogma = {aggression = 0.65, bravery = 0.95, loyalty = 1.20, fanaticism = 0.05, boarding = 0.5, deviation = 0.30}
computer = {sophistication = 0.92}
sensors = {range = 1.0}
captains = {competence = 0.70, competence_dev = 0.15, discipline = 0.80, creativity = 0.55, deviation = 0.15}

