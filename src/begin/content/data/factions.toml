# Factions. `dogma` is Begin's decoded nation dogma [R]; everything else is a
# remake extension [E]: computer sophistication, captain competence model,
# doctrine and ordnance compatibility.
#
# computer.sophistication (0..1) drives concrete capabilities, never a flat
# combat bonus: point-defense reaction time and track quality, torpedo
# solution accuracy, scan fidelity, dead-reckoning of lost contacts, threat
# prediction horizon and the quality of recommendations shown to the player.
#
# morale (optional): start is the crew's spirits at the start of a battle (0..100); steadiness scales how
#   much damage and losses shake them (below 1: they hold under fire).
#
# orders (optional): special orders the race's crews are drilled in. "evasive": the helm can be told to
#   dodge incoming torpedoes on its own until the captain gives another navigation order.
#
# colors (optional): how the race's weapons look on the map, so you can tell who fired what.
#   phaser and torpedo are #RRGGBB; phaser_style is "beam" (a steady line) or "pulse" (a string of bolts),
#   which also tells races apart for players who can't separate two colours.
# computer.pd_discipline (0..1): how many phaser banks point defense spends on one
# torpedo. Disciplined crews send one bank per threat and keep the rest charged;
# trigger-happy ones pour several onto the first round they see, and can be baited [E].
#
# temperament (optional) [E]: how the race's captains take seeing their allies battered, and how they answer
#   a hail. temper 0 = cowed by it (readier to yield, withdraw or surrender), 1 = enraged by it (they fight
#   harder and go after whoever did it); obstinacy = how hard they are to talk round before anything has
#   happened. Every loss they watch wears obstinacy down. deviation varies each captain around the race's values.
#
# sensors.range (×) scales every class's rated sensor range for this faction [E].
# Inside rated range an uncloaked ship is seen exactly and identified; out to
# 1.5× it is a hazy, unidentified return; beyond that it is lost.

[[faction]]
id = "federation"
name = "Federation"
long_name = "United Federation of Planets"
command = "Starfleet Command"
doctrine = "starfleet"
torpedoes = ["mk7", "mk8"]
probes = ["px2", "pxd2"]
officer_names = ["Spock", "Sulu", "Chekov", "Uhura", "Scott", "McCoy"]
captain_names = ["Webster", "Bronson", "Decker", "Wesley", "Pappas", "Chang", "Garrovick", "Tracey", "Harris", "Rios", "Shaw", "Vale"]
dogma = {aggression = 0.65, bravery = 0.95, loyalty = 1.20, fanaticism = 0.05, boarding = 0.5, deviation = 0.30}
computer = {sophistication = 0.92, pd_discipline = 0.85}
sensors = {range = 1.0}
captains = {competence = 0.70, competence_dev = 0.15, discipline = 0.80, creativity = 0.55, deviation = 0.15}
colors = {phaser = "#FFA04A", phaser_style = "beam", torpedo = "#FF5E3A"}   # orange phasers, red-orange photon torpedoes
morale = {start = 80, steadiness = 0.9}   # disciplined, and they trust their captain
temperament = {temper = 0.3, obstinacy = 0.5, deviation = 0.2}
orders = ["evasive"]

