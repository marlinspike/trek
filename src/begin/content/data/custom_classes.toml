# ---------------------------------------------------------------- the Borg [E]
#
# Borg ships carry far more power than their size suggests (thousands of drones need life support too) and
# their drives run cool: a cube never burns out her own engines.
# Drones repair whatever is hurt as fast as it is hurt (high repair rates), shields recharge quickly, and the
# hull grows back (collective.regen_hull in factions.toml). Crew counts are drones.

[[class]]
