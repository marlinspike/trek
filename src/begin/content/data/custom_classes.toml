# Hand-written ship classes [E]. The importer regenerates classes.toml but never touches this file.
# Every field of a class is needed unless it is made from another with `base = "<class id>"`.

# ---------------------------------------------------------------- Federation

# The Enterprise after her cloak refit in the tour "The Collective": a Dreadnought with a cloaking device Geordi
# and Spock built from Romulan salvage. Only that story fits it; every other battle has the plain Dreadnought.
[[class]]
id = "federation.dnc"
base = "federation.dn"
name = "Dreadnought (cloak refit)"
abbrev = "DN"
story = true
can_cloak = true
cloak_energy = 160.0
repair = {reactor = 1.0, battery = 1.2, phaser = 0.6, tube = 0.4, launcher = 0.8, drive = 0.2, shield = 0.4, transporter = 1.0, sensors = 1.0, cloak = 0.5, impulse = 1.0, tractor = 1.0}

