damage = 0.0
arm_time = 1.0
max_time_fuse = 12.0
max_prox = 100.0
homing = false
speed_variance = 0.0
warhead_type = 0
charge_time = 3.0
load_energy = 10.0
reveal_radius = 6000.0
reveal_cycles = 30.0
special = true
