# Tours of duty [E]: linked battles where your squadron carries its damage, crew, torpedoes,
# morale and prizes from one fight to the next. The format is described in src/begin/tour/model.py;
# write your own in config/tours/<anything>.toml (a tour with the same id replaces one of these).
#
# Each stop's `transit` is the cycles of travel before it (field repairs happen on the way),
# and `eta` is how long Starfleet's reinforcements take to reach it.

[[tour]]
id = "border-patrol"
title = "Border Patrol"
sector = "The Archanis sector"
description = "Patrol the Klingon border, deal with whatever you find, and fall back to Starbase 12 when the Klingons move on it. Six stops, about an hour."
flagship = "federation.dn"
budget = 260
reinforcement_calls = 2
reinforcements = ["federation.de", "federation.de", "federation.hc", "federation.in"]
starbase = "Starbase 12"

[[tour.stop]]
id = "raiders"
title = "Orion raiders"
system = "Tau Ceti"
chart = [0.12, 0.70]
transit = 120
eta = 90
officer = "seven"
seed = 11
briefing = """
Two Orion vessels are preying on shipping near Tau Ceti: an Anarchist and a Raider. They are fast and lightly
built, and they will scatter rather than stand and fight. Destroy them or drive them off before they reach the
shipping lanes. It is also a chance to see how the squadron works together before the border.
"""
enemies = ["orion.an", "orion.ra"]
enemy_center = [5000, 10000]

[[tour.stop]]
id = "border"
title = "A Klingon on the border"
system = "Archanis IV"
chart = [0.30, 0.42]
transit = 160
eta = 140
officer = "worf"
seed = 23
briefing = """
A Klingon battle cruiser and her escort are probing the border at Archanis. Their captain will test us. A
battle cruiser carries five tubes and fights best at torpedo range. If we can knock out her life support and
board her, she would make a fine addition to the squadron.
"""
enemies = ["klingon.bc", "klingon.es"]

[[tour.stop]]
id = "frigates"
title = "Frigates at Kessik"
system = "Kessik"
chart = [0.48, 0.25]
transit = 150
eta = 170
officer = "spock"
seed = 37
briefing = """
Two Klingon frigates are holding the Kessik relay station. They are no match for us one at a time; the logical
course is to separate them. Their reports will reach the Klingon fleet whatever happens here, so it would be
best if none of them escaped to make one.
"""
enemies = ["klingon.fr", "klingon.fr"]

[[tour.stop]]
id = "ambush"
title = "Romulan ambush"
system = "Galorndon Core"
chart = [0.66, 0.40]
transit = 140
eta = 200
officer = "spock"
seed = 41
briefing = """
A distress call from Galorndon Core. Sensors show nothing there, which is in itself suspicious: the Romulans
have used this system for ambushes before. Expect two Birds of Prey under cloak and plasma torpedoes at close
range. Keep our weakest shields away from where they are likely to decloak.
"""
enemies = ["romulan.bp", "romulan.bp"]
enemy_center = [-4000, 7000]

[[tour.stop.choice]]
label = "Refit at Starbase 12"
consequence = "Every ship repaired, rearmed and fully crewed, but the detour gives the Klingons time to bring another battle cruiser to the starbase."
refit = true
transit = 360
flags = ["refit"]

[[tour.stop.choice]]
label = "Press on as we are"
consequence = "No delay, and no more Klingons at the starbase. Your crews keep patching on the way, to 75% hull at most."

[[tour.stop]]
id = "scout"
title = "The scouting dreadnought"
system = "Khitomer approach"
chart = [0.80, 0.62]
transit = 150
eta = 150
officer = "worf"
seed = 53
win_flag = "dreadnought-beaten"
briefing = """
A Klingon dreadnought is scouting ahead of the main force, with a frigate in company. She carries eight tubes.
If we defeat her here, she will not be at the starbase when the Klingons attack. A dreadnought fights best at
long range; we must close the distance, or not let her choose it.
"""
enemies = ["klingon.dr", "klingon.fr"]

[[tour.stop]]
id = "starbase"
title = "Starbase Defense"
system = "Starbase 12"
chart = [0.58, 0.85]
transit = 180
eta = 60
officer = "spock"
seed = 67
finale = true
friends = ["federation.sb"]
player_center = [0, -6000]
friends_center = [0, -4000]
enemy_center = [0, 17000]
briefing = """
The Klingon force has arrived at Starbase 12. They will come in waves: frigates first, then their battle
cruisers, then the heavy ships. Between waves, damaged ships should dock and repair; the starbase's docking
bays are at our disposal. If the starbase falls, the tour has failed.
"""
enemies = ["klingon.fr", "klingon.fr"]
[tour.stop.add]
refit = ["klingon.bc"]

[[tour.stop.wave]]
ships = ["klingon.bc", "klingon.es"]
after_clear = 60
at = 420
center = [6000, 17000]
message = "A Klingon battle cruiser and her escort are dropping out of warp!"

[[tour.stop.wave]]
ships = ["klingon.dr", "klingon.fr"]
after_clear = 75
at = 900
center = [-6000, 17000]
unless_flag = "dreadnought-beaten"
message = "Klingon dreadnought inbound with a frigate: the main force is here."

[[tour.stop.wave]]
ships = ["klingon.bc", "klingon.fr"]
after_clear = 75
at = 900
center = [-6000, 17000]
if_flag = "dreadnought-beaten"
message = "The Klingon main force is here: a battle cruiser and a frigate. Without their dreadnought, they can be beaten."


[[tour]]
id = "neutral-zone"
title = "Neutral Zone Watch"
sector = "The Romulan Neutral Zone"
description = "Four stops along the Neutral Zone. The Romulans cloak, strike and vanish; Starbase 47 is the line they must not cross. About forty minutes."
flagship = "federation.dn"
budget = 200
reinforcement_calls = 2
reinforcements = ["federation.de", "federation.hc"]
starbase = "Starbase 47"

[[tour.stop]]
id = "outpost"
title = "Silence at Outpost 4"
system = "Outpost 4"
chart = [0.15, 0.30]
transit = 120
eta = 120
officer = "seven"
seed = 101
briefing = """
Outpost 4 has stopped answering. Two Romulan War Eagles are in the area. They are small and quick and will try
to draw us apart. A tachyon pulse from the deflector will show them if they cloak at close range.
"""
enemies = ["romulan.we", "romulan.we"]

[[tour.stop]]
id = "frigates"
title = "Frigate screen"
system = "Gamma Hromi"
chart = [0.40, 0.55]
transit = 150
eta = 150
officer = "worf"
seed = 113
briefing = """
A Romulan frigate screen is shadowing a Bird of Prey through Gamma Hromi. Destroy the screen and the Bird of
Prey is exposed. Their plasma torpedoes are slow; we can outrun them if we see them in time.
"""
enemies = ["romulan.fr", "romulan.fr", "romulan.bp"]

[[tour.stop]]
id = "nebula"
title = "The Bird of Prey"
system = "Devron nebula"
chart = [0.65, 0.35]
transit = 140
eta = 180
officer = "spock"
seed = 127
briefing = """
The Bird of Prey that escaped us is regrouping in the Devron nebula with a second. Two cloaked ships at close
range: a dangerous combination. Fortunately they must decloak to fire.
"""
enemies = ["romulan.bp", "romulan.bp"]

[[tour.stop.choice]]
label = "Refit at Starbase 47"
consequence = "Repaired, rearmed and fully crewed, but the Romulans get time to bring a third Bird of Prey to the starbase."
refit = true
transit = 320
flags = ["refit"]

[[tour.stop.choice]]
label = "Press on as we are"
consequence = "No delay. Your crews keep patching on the way, to 75% hull at most."

[[tour.stop]]
id = "starbase"
title = "The line at Starbase 47"
system = "Starbase 47"
chart = [0.85, 0.70]
transit = 160
eta = 60
officer = "spock"
seed = 139
finale = true
friends = ["federation.sb"]
player_center = [0, -6000]
friends_center = [0, -4000]
enemy_center = [0, 16000]
briefing = """
The Romulans have committed to an attack on Starbase 47. War Eagles first, then the Birds of Prey. Hold the
starbase; dock between waves to repair.
"""
enemies = ["romulan.we", "romulan.we", "romulan.fr"]
[tour.stop.add]
refit = ["romulan.bp"]

[[tour.stop.wave]]
ships = ["romulan.bp", "romulan.bp"]
after_clear = 70
at = 600
center = [5000, 16000]
message = "Two Romulan Birds of Prey decloaking!"


[[tour]]
id = "orion-run"
title = "The Orion Run"
sector = "The Orion trade routes"
description = "A short hunt for an Orion raiding band: three stops, about twenty minutes. A good first tour."
flagship = "federation.dn"
budget = 160
reinforcement_calls = 1
reinforcements = ["federation.in", "federation.de"]
starbase = "Starbase 9"

[[tour.stop]]
id = "convoy"
title = "Raid on a convoy"
system = "Rigel"
chart = [0.20, 0.55]
transit = 100
eta = 90
officer = "worf"
seed = 201
briefing = """
An Orion Anarchist and two Assassins have hit a convoy near Rigel. They are fragile but fast. Their captains
have no stomach for a fair fight.
"""
enemies = ["orion.an", "orion.as", "orion.as"]

[[tour.stop]]
id = "saboteurs"
title = "Saboteurs"
system = "Rigel VII"
chart = [0.50, 0.30]
transit = 140
eta = 120
officer = "seven"
seed = 211
briefing = """
Two Orion Saboteurs are lying in wait. They will try to lure us in close. Their armour is thin; their probes
are not.
"""
enemies = ["orion.sa", "orion.sa"]

[[tour.stop]]
id = "armadillo"
title = "The Armadillo"
system = "Orion's hideout"
chart = [0.80, 0.60]
transit = 160
eta = 150
officer = "spock"
seed = 223
briefing = """
The raiders' base of operations is an Armadillo: a slow, heavily armoured ship with two Raiders in company.
Take her and the band is finished.
"""
enemies = ["orion.ar", "orion.ra", "orion.ra"]
